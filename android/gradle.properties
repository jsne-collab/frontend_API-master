# Machine has 7G physical RAM total — 8G heap + 4G metaspace was more than
# physically available and crashed the daemon with a native OOM (mmap failed).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental cache fails to relativize paths across drive letters
# (project on D:, Pub cache on C:) — disable to avoid "different roots" crash.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
